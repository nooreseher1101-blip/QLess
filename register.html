
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | QLess</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        :root {
            --dark-navy: #0B1F33;
            --primary-navy: #17365D;
            --secondary-blue: #456789;
            --light-bg: #F3F5F8;
            --text-dark: #263238;
            --text-muted: #6C757D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .navbar {
            background-color: var(--dark-navy);
            padding: 18px 0;
            border-bottom: 2px solid #294F78;
        }

        .navbar-brand {
            color: white !important;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .navbar-brand i {
            color: #AFC8E8;
            margin-right: 7px;
        }

        .back-home {
            color: #E6EDF5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .back-home:hover {
            color: #AFC8E8;
        }

        /* REGISTER SECTION */

        .register-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 510px;
            background-color: white;
            border-radius: 15px;
            padding: 38px 42px;
            box-shadow: 0 10px 35px rgba(11, 31, 51, 0.08);
            border: 1px solid #E8ECF1;
        }

        .register-icon {
            width: 62px;
            height: 62px;
            background-color: #EAF0F7;
            color: var(--primary-navy);
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 17px;
        }

        .register-card h2 {
            text-align: center;
            color: var(--dark-navy);
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 9px;
        }

        .register-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 28px;
        }

        /* FORM */

        .form-label {
            color: var(--dark-navy);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        .input-group-text {
            background-color: #F5F7FA;
            border: 1px solid #DDE3EA;
            color: var(--secondary-blue);
            padding: 11px 13px;
        }

        .form-control {
            border: 1px solid #DDE3EA;
            padding: 11px 13px;
            font-size: 13px;
            color: var(--text-dark);
        }

        .form-control:focus {
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 3px rgba(69, 103, 137, 0.12);
        }

        .input-group .form-control {
            border-left: none;
        }

        .input-group .input-group-text {
            border-radius: 7px 0 0 7px;
        }

        .input-group .form-control {
            border-radius: 0 7px 7px 0;
        }

        .form-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* TERMS */

        .terms-check {
            margin-top: 7px;
            margin-bottom: 20px;
        }

        .terms-check label {
            color: var(--text-muted);
            font-size: 12px;
        }

        .terms-check a {
            color: var(--primary-navy);
            font-weight: 600;
            text-decoration: none;
        }

        .form-check-input:checked {
            background-color: var(--primary-navy);
            border-color: var(--primary-navy);
        }

        /* REGISTER BUTTON */

        .register-button {
            width: 100%;
            background-color: var(--primary-navy);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s;
        }

        .register-button:hover {
            background-color: var(--dark-navy);
            color: white;
            transform: translateY(-2px);
        }

        /* LOGIN LINK */

        .login-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 22px;
            margin-bottom: 0;
        }

        .login-text a {
            color: var(--primary-navy);
            font-weight: 700;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        footer {
            background-color: var(--dark-navy);
            color: #AAB8C7;
            text-align: center;
            padding: 17px 10px;
            font-size: 12px;
        }

        /* RESPONSIVE */

        @media (max-width: 576px) {

            .register-card {
                padding: 30px 22px;
            }

            .register-card h2 {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand" href="index.html">
                <i class="bi bi-hourglass-split"></i>QLess
            </a>

            <a href="index.html" class="back-home">
                <i class="bi bi-arrow-left me-1"></i>
                Back to Home
            </a>

        </div>

    </nav>


    <!-- REGISTER SECTION -->

    <section class="register-section">

        <div class="register-card">

            <div class="register-icon">
                <i class="bi bi-person-plus"></i>
            </div>

            <h2>Create Your Account</h2>

            <p class="register-subtitle">
                Join QLess and make your university visits easier.
            </p>


            <!-- REGISTRATION FORM -->

            <form action="#" method="post">


                <!-- FULL NAME -->

                <div class="mb-3">

                    <label for="fullName" class="form-label">
                        Full Name
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            class="form-control"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>

                </div>


                <!-- PHONE NUMBER -->

                <div class="mb-3">

                    <label for="phone" class="form-label">
                        Phone Number
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-telephone"></i>
                        </span>

                        <input
                            type="tel"
                            class="form-control"
                            id="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                    </div>

                    <div class="form-text">
                        Password must contain at least 8 characters.
                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-3">

                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-shield-lock"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Re-enter your password"
                            required
                        >

                    </div>

                </div>


                <!-- TERMS AND CONDITIONS -->

                <div class="form-check terms-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label class="form-check-label" for="terms">

                        I agree to the
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>.

                    </label>

                </div>


                <!-- REGISTER BUTTON -->

                <button type="submit" class="register-button">

                    Create Account
                    <i class="bi bi-arrow-right ms-2"></i>

                </button>


            </form>


            <!-- LOGIN LINK -->

            <p class="login-text">

                Already have an account?

                <a href="login.html">Login Here</a>

            </p>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p class="mb-0">
            &copy; 2026 QLess. All Rights Reserved.
            | Skip the Line. Save Your Time.
        </p>

    </footer>


    <!-- BOOTSTRAP JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
