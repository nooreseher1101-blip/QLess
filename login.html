
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | QLess</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        :root {
            --dark-navy: #0B1F33;
            --primary-navy: #17365D;
            --secondary-blue: #456789;
            --light-bg: #F3F5F8;
            --text-dark: #263238;
            --text-muted: #6C757D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .navbar {
            background-color: var(--dark-navy);
            padding: 18px 0;
            border-bottom: 2px solid #294F78;
        }

        .navbar-brand {
            color: white !important;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .navbar-brand i {
            color: #AFC8E8;
            margin-right: 7px;
        }

        .back-home {
            color: #E6EDF5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .back-home:hover {
            color: #AFC8E8;
        }

        /* LOGIN SECTION */

        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 55px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background-color: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(11, 31, 51, 0.08);
            border: 1px solid #E8ECF1;
        }

        .login-icon {
            width: 65px;
            height: 65px;
            background-color: #EAF0F7;
            color: var(--primary-navy);
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 29px;
            margin: 0 auto 20px;
        }

        .login-card h2 {
            text-align: center;
            color: var(--dark-navy);
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 9px;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 30px;
        }

        /* FORM */

        .form-label {
            color: var(--dark-navy);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-group {
            margin-bottom: 21px;
        }

        .input-group-text {
            background-color: #F5F7FA;
            border: 1px solid #DDE3EA;
            color: var(--secondary-blue);
            padding: 12px 14px;
        }

        .form-control,
        .form-select {
            border: 1px solid #DDE3EA;
            padding: 12px 13px;
            font-size: 13px;
            color: var(--text-dark);
            border-radius: 7px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--secondary-blue);
            box-shadow: 0 0 0 3px rgba(69, 103, 137, 0.12);
        }

        .input-group .form-control {
            border-left: none;
        }

        .input-group .input-group-text {
            border-radius: 7px 0 0 7px;
        }

        .password-input {
            border-radius: 0 7px 7px 0 !important;
        }

        .forgot-link {
            color: var(--secondary-blue);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
        }

        .forgot-link:hover {
            color: var(--dark-navy);
        }

        .remember-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-check-input:checked {
            background-color: var(--primary-navy);
            border-color: var(--primary-navy);
        }

        /* LOGIN BUTTON */

        .login-button {
            width: 100%;
            background-color: var(--primary-navy);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 700;
            margin-top: 10px;
            transition: 0.3s;
        }

        .login-button:hover {
            background-color: var(--dark-navy);
            color: white;
            transform: translateY(-2px);
        }

        .signup-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 25px;
            margin-bottom: 0;
        }

        .signup-text a {
            color: var(--primary-navy);
            font-weight: 700;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        footer {
            background-color: var(--dark-navy);
            color: #AAB8C7;
            text-align: center;
            padding: 17px 10px;
            font-size: 12px;
        }

        /* RESPONSIVE */

        @media (max-width: 576px) {

            .login-card {
                padding: 30px 22px;
            }

            .login-card h2 {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="container d-flex justify-content-between align-items-center">

            <a class="navbar-brand" href="index.html">
                <i class="bi bi-hourglass-split"></i>QLess
            </a>

            <a href="index.html" class="back-home">
                <i class="bi bi-arrow-left me-1"></i>
                Back to Home
            </a>

        </div>

    </nav>


    <!-- LOGIN SECTION -->

    <section class="login-section">

        <div class="login-card">

            <div class="login-icon">
                <i class="bi bi-person-lock"></i>
            </div>

            <h2>Welcome Back!</h2>

            <p class="login-subtitle">
                Login to your QLess account to continue.
            </p>


            <!-- LOGIN FORM -->

            <form action="#" method="post">


                <!-- EMAIL -->

                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control password-input"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>


                <!-- LOGIN AS -->

                <div class="mb-4">

                    <label for="role" class="form-label">
                        Login As
                    </label>

                    <select class="form-select" id="role" required>

                        <option value="" selected disabled>
                            Select your role
                        </option>

                        <option value="admin">Administrator</option>

                        <option value="staff">Staff</option>

                        <option value="user">User</option>

                    </select>

                </div>


                <!-- REMEMBER & FORGOT PASSWORD -->

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="remember"
                        >

                        <label class="form-check-label remember-text" for="remember">
                            Remember me
                        </label>

                    </div>

                    <a href="#" class="forgot-link">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit" class="login-button">

                    Login to QLess
                    <i class="bi bi-arrow-right ms-2"></i>

                </button>


            </form>


            <!-- SIGN UP LINK -->

            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">Create Account</a>

            </p>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p class="mb-0">
            &copy; 2026 QLess. All Rights Reserved.
            | Skip the Line. Save Your Time.
        </p>

    </footer>


    <!-- BOOTSTRAP JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
